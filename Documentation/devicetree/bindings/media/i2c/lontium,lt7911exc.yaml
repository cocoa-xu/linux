%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/lontium,lt7911exc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Lontium LT7911EXC USB Type-C/DisplayPort to MIPI CSI-2 bridge

maintainers:
  - Cocoa <i@uwucocoa.moe>

description:
  The LT7911EXC receives DisplayPort (or USB Type-C alternate mode) video
  and sends it as MIPI CSI-2 YUV422 8-bit under control of its own
  firmware. The host reads the detected timings over I2C.

properties:
  compatible:
    const: lontium,lt7911exc

  reg:
    maxItems: 1

  interrupts:
    description: Raised by the firmware when the input appears or disappears.
    maxItems: 1

  reset-gpios:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes

required:
  - compatible
  - reg
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        video-bridge@41 {
            compatible = "lontium,lt7911exc";
            reg = <0x41>;
            interrupts-extended = <&gpio1 0 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&gpio1 1 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&vin_in>;
                    data-lanes = <1 2 3 4>;
                };
            };
        };
    };
