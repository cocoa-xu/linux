%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/axera,ax620e-periph-sys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axera AX620E peripheral clock and reset controller

maintainers:
  - Cocoa <i@uwucocoa.moe>

description:
  Clock gates, source muxes and resets of the low-speed peripherals (GPIO,
  I2C, I2S, DMA) on Axera AX620E SoCs, the routing of the I2S controllers
  and of the peripheral DMA requests, which the DMA controller reaches as
  a syscon.
  Indices are defined in
  include/dt-bindings/clock/axera,ax620e-periph-sys.h and
  include/dt-bindings/reset/axera,ax620e-periph-sys.h.

properties:
  compatible:
    items:
      - const: axera,ax620e-periph-sys
      - const: syscon

  reg:
    maxItems: 1

  clocks:
    items:
      - description: 32.768 kHz RTC clock
      - description: CPLL 24 MHz output
      - description: EPLL 50 MHz output
      - description: CPLL 156 MHz output
      - description: CPLL 208 MHz output
      - description: Peripheral APB clock
      - description: HPLL 12.288 MHz output, the audio reference

  clock-names:
    items:
      - const: rtc_32k
      - const: cpll_24m
      - const: epll_50m
      - const: cpll_156m
      - const: cpll_208m
      - const: pclk_top
      - const: hpll_12m288

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  axera,audio-routing:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Value of the audio routing register, which connects the I2S
      controllers to pads, to each other and to the internal codec. It
      depends on how the board is wired.

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@4870000 {
        compatible = "axera,ax620e-periph-sys", "syscon";
        reg = <0x04870000 0x1000>;
        clocks = <&rtc_32k>, <&cpll_24m>, <&epll_50m>,
                 <&cpll_156m>, <&cpll_208m>, <&pclk_top>,
                 <&hpll_12m288>;
        clock-names = "rtc_32k", "cpll_24m", "epll_50m",
                      "cpll_156m", "cpll_208m", "pclk_top",
                      "hpll_12m288";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
