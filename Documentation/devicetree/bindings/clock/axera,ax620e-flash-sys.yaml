%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/axera,ax620e-flash-sys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axera AX620E FLASH_SYS clock and reset controller

maintainers:
  - Cocoa <i@uwucocoa.moe>

description:
  Clocks and resets of the USB 2.0 controller and the SD/SDIO hosts on
  Axera AX620E SoCs. The block also holds the USB VBUS-valid override, which
  the USB PHY reaches through the axera,flash-sys phandle. Indices are
  defined in include/dt-bindings/clock/axera,ax620e-flash-sys.h and
  include/dt-bindings/reset/axera,ax620e-flash-sys.h.

properties:
  compatible:
    const: axera,ax620e-flash-sys

  reg:
    maxItems: 1

  clocks:
    items:
      - description: CPLL 24 MHz output
      - description: EPLL 100 MHz output
      - description: CPLL 156 MHz output
      - description: CPLL 208 MHz output
      - description: EPLL 250 MHz output
      - description: CPLL 312 MHz output
      - description: NPLL 400 MHz output
      - description: Peripheral APB clock

  clock-names:
    items:
      - const: cpll_24m
      - const: epll_100m
      - const: cpll_156m
      - const: cpll_208m
      - const: epll_250m
      - const: cpll_312m
      - const: npll_400m
      - const: pclk_top

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@10030000 {
        compatible = "axera,ax620e-flash-sys";
        reg = <0x10030000 0x9000>;
        clocks = <&cpll_24m>, <&epll_100m>, <&cpll_156m>, <&cpll_208m>,
                 <&epll_250m>, <&cpll_312m>, <&npll_400m>, <&pclk_top>;
        clock-names = "cpll_24m", "epll_100m", "cpll_156m", "cpll_208m",
                      "epll_250m", "cpll_312m", "npll_400m", "pclk_top";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
