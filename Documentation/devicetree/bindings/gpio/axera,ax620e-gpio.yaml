%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/axera,ax620e-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Axera AX620E GPIO controller

maintainers:
  - Cocoa <i@uwucocoa.moe>

description:
  Bank of 32 GPIO lines with one control register per line and one
  interrupt output for the bank.

properties:
  compatible:
    const: axera,ax620e-gpio

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Debounce clock
      - description: APB clock

  resets:
    maxItems: 1

  gpio-controller: true

  '#gpio-cells':
    const: 2

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

required:
  - compatible
  - reg
  - clocks
  - gpio-controller
  - '#gpio-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/axera,ax620e-periph-sys.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/axera,ax620e-periph-sys.h>

    gpio@4801000 {
        compatible = "axera,ax620e-gpio";
        reg = <0x04801000 0x400>;
        interrupts = <GIC_SPI 115 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&periph_sys AX620E_PERIPH_CLK_GPIO1>,
                 <&periph_sys AX620E_PERIPH_PCLK_GPIO1>;
        resets = <&periph_sys AX620E_PERIPH_RST_GPIO1>;
        gpio-controller;
        #gpio-cells = <2>;
        interrupt-controller;
        #interrupt-cells = <2>;
    };
